name: Buffer Top-up
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch: {}
jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          QUEUE_TARGET: '10'
        run: python buffer_topup.py
